name: Deploy to GitHub Pages
on:
  push:
    branches: [ "publish" ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config --global user.name "sarakkermani "
          git config --global user.email "sarakkermani@gmail.com"
      - run: |
          git checkout publish
          git add .
          git diff --cached --quiet || git commit -m "Deploy to GitHub Pages"
          git push origin publish
permissions:
  contents: write